[package]
name = "flowcheck"
version = "0.1.0"
edition = "2021"
description = "Checks intended C# method-flow changes against a git delta"
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23"
